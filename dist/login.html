<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Crystal Glow</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand auth-brand" href="/"><span class="brand-mark">cg</span><span class="brand-word">crystal glow<small>SKINCARE, SOFTLY</small></span></a>
    <p class="eyebrow">Welcome back</p>
    <h1>Come back to your <em>ritual.</em></h1>
    <p class="auth-intro">Sign in to keep your details close and follow your orders. Guest checkout remains available.</p>
    <form id="login-form">
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
      <button class="button button-dark" type="submit">Sign in <span>→</span></button>
    </form>
    <p class="auth-message" id="auth-message" role="status"></p>
    <p class="auth-switch">New to Crystal Glow? <a href="#" id="register-link">Create an account</a></p>
    <a class="text-link" href="/">← Back to the collection</a>
  </main>
  <script src="/login.js"></script>
</body>
</html>
